<title>Kiki's Glam Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: Kiki stands on a salon "set" (left), chunky tap-tray of tools (right); stacks on phones. Single bright candy look by choice. */
:root{
  --bg:#FFF0F6; --ink:#6B1747; --berry:#C2266F; --pink:#FF8DC0; --blush:#FFD0E4;
  --mint:#8EE3CF; --lemon:#FFD95C; --lilac:#B9A2FF; --card:#FFFFFF; --tray:#FFE6F1;
  --display:'Grandstander','Comic Sans MS','Chalkboard SE',system-ui,sans-serif;
  --body:'Nunito','Trebuchet MS',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.app{height:100%;box-sizing:border-box;display:grid;grid-template-rows:auto minmax(0,1fr);gap:12px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:900;font-size:clamp(22px,3.2vw,34px);margin:0;color:var(--berry);flex:1 1 auto;line-height:1.05;text-wrap:balance}
h1 span{color:var(--pink)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab,.iconbtn{appearance:none;border:0;font:inherit;cursor:pointer;color:var(--ink)}
.tab{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:8px 14px 8px 8px;font-weight:900;font-size:15px;box-shadow:0 3px 0 #F5C2D9;transition:transform .12s}
.tab .n{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--tray);font-size:18px}
.tab[aria-current="step"]{background:var(--berry);color:#fff;box-shadow:0 3px 0 #8E1650}
.tab[aria-current="step"] .n{background:#fff3}
.tab:active,.opt:active,.sw:active,.big:active{transform:scale(.93)}
.iconbtn{width:44px;height:44px;border-radius:50%;background:var(--card);font-size:22px;box-shadow:0 3px 0 #F5C2D9}
:focus-visible{outline:4px solid var(--lilac);outline-offset:3px}

main{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(320px,470px);gap:16px;min-height:0}
.stage{position:relative;border-radius:32px;overflow:hidden;min-height:0;transition:background .5s}
.stage::before{content:"";position:absolute;left:50%;top:5%;width:min(70%,420px);height:72%;transform:translateX(-50%);border-radius:999px 999px 28px 28px;transition:all .5s}
.stage::after{content:"";position:absolute;left:0;right:0;bottom:0;height:16%;transition:background .5s}
.stage[data-stage="hair"]{background:radial-gradient(circle,#fff8 0 3px,transparent 4px) 0 0/36px 36px,linear-gradient(#FFD3E6,#FFB8D6)}
.stage[data-stage="hair"]::before{background:linear-gradient(160deg,#ffffffcc,#E9F7FF99);border:10px solid #FFE7A3}
.stage[data-stage="hair"]::after{background:repeating-linear-gradient(90deg,#fff 0 40px,#FFC6DE 40px 80px)}
.stage[data-stage="makeup"]{background:radial-gradient(circle,#fff8 0 3px,transparent 4px) 0 0/36px 36px,linear-gradient(#E6DBFF,#CDB9FF)}
.stage[data-stage="makeup"]::before{background:linear-gradient(160deg,#ffffffd9,#FFF2FA99);border:12px dotted #FFE07A;box-shadow:0 0 0 8px #F7D7FF}
.stage[data-stage="makeup"]::after{background:#BFA6F5}
.stage[data-stage="clothes"]{background:repeating-linear-gradient(90deg,#D7F6EC 0 46px,#C3F0E1 46px 92px)}
.stage[data-stage="clothes"]::before{background:linear-gradient(#ffffffb3,#ffffff66);border:10px solid #fff;border-radius:28px}
.stage[data-stage="clothes"]::after{background:#9FDCC8}
.stage[data-stage="show"]{background:radial-gradient(ellipse 40% 70% at 30% 0%,#fff3 0,transparent 70%),radial-gradient(ellipse 40% 70% at 70% 0%,#ffe9a733 0,transparent 70%),linear-gradient(#3B1458,#5E1E6E)}
.stage[data-stage="show"]::before{background:radial-gradient(ellipse at 50% 100%,#FFD95C55,transparent 65%);border:0}
.stage[data-stage="show"]::after{background:linear-gradient(#C2266F,#8E1650)}
#kiki{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.say{position:absolute;z-index:2;top:14px;right:14px;max-width:min(60%,260px);background:#fff;border-radius:22px;padding:10px 16px;font-family:var(--display);font-weight:900;font-size:clamp(16px,2.2vw,22px);color:var(--berry);box-shadow:0 4px 0 #F0B5CF;transform:scale(.6);opacity:0;transition:all .25s cubic-bezier(.3,1.6,.6,1);transform-origin:20% 100%}
.say.on{opacity:1;transform:scale(1)}
.conf{position:absolute;top:0;width:10px;height:14px;border-radius:3px;z-index:3;pointer-events:none}

.panel{background:var(--card);border-radius:28px;overflow-y:auto;min-height:0;padding:16px 16px 22px;box-shadow:0 4px 0 #F5C2D9;-webkit-overflow-scrolling:touch}
.panel-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.panel-top h2{font-family:var(--display);font-weight:900;font-size:24px;margin:0;color:var(--berry)}
.surprise{appearance:none;border:0;cursor:pointer;font:inherit;font-weight:900;background:var(--lemon);color:var(--ink);border-radius:999px;padding:8px 14px;box-shadow:0 3px 0 #E3B630}
.sec{margin-top:14px}
.sec h3{margin:0 0 8px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#A2457A}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.opt{appearance:none;font:inherit;color:var(--ink);cursor:pointer;border:3px solid transparent;background:var(--tray);border-radius:20px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:78px;min-width:0;transition:transform .12s,background .2s}
.opt[aria-pressed="true"]{border-color:var(--berry);background:#fff;box-shadow:0 0 0 4px var(--blush)}
.opt .ico{width:46px;height:46px;color:var(--ink)}
.opt .emo{font-size:36px;line-height:1.1}
.opt .th{height:76px;width:100%;max-width:96px}
.opt.tall .th{height:110px}
.lbl{font-weight:900;font-size:12.5px;line-height:1.1;text-align:center}
.swatches{display:flex;flex-wrap:wrap;gap:12px}
.sw{appearance:none;cursor:pointer;width:50px;height:50px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px #F3C3D8;background:var(--c);transition:transform .12s}
.sw[aria-pressed="true"]{box-shadow:0 0 0 4px var(--berry);transform:scale(1.08)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{font-weight:900;font-size:13px;padding:6px 10px;border-radius:999px;background:var(--tray);color:#A2457A}
.step.done{background:var(--mint);color:#0F5A4A}
.next{display:block;width:100%;margin-top:18px;appearance:none;border:0;cursor:pointer;font-family:var(--display);font-weight:900;font-size:22px;color:#fff;background:var(--berry);border-radius:22px;padding:14px;box-shadow:0 5px 0 #8E1650}
.showcard{text-align:center;padding:10px 6px 4px}
.showcard .wow{font-family:var(--display);font-weight:900;font-size:44px;color:var(--berry);margin:0;line-height:1}
.showcard p{margin:6px 0 0;font-weight:700;font-size:17px}

.tw{animation:tw 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.55)}}
.eye{animation:blink 5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.sway{animation:sway 3.2s ease-in-out infinite}
@keyframes sway{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.tw,.eye,.sway{animation:none}}

@media (max-width:819px){
  main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(250px,48%) minmax(0,1fr);gap:10px}
  .tab{padding:6px 10px 6px 6px;font-size:13px}
  .tab .n{width:26px;height:26px;font-size:16px}
  .say{font-size:15px;top:10px;right:10px}
}
@media (max-width:430px){ .tab .t{display:none} .tab{padding:6px} h1{font-size:21px} .g4{grid-template-columns:repeat(3,minmax(0,1fr))} }
#scene{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.stage[data-stage]{background:#EFD3DE}
.stage[data-stage]::before,.stage[data-stage]::after{display:none}
#kiki{filter:drop-shadow(0 10px 16px rgba(50,12,35,.22))}
.subtabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.subtab{appearance:none;border:3px solid transparent;cursor:pointer;font:inherit;font-weight:900;font-size:15px;color:var(--ink);background:var(--tray);border-radius:999px;padding:8px 14px}
.subtab[aria-pressed="true"]{background:var(--berry);color:#fff}
#kiki{touch-action:none}
.stk{cursor:grab}.stk.drag{cursor:grabbing;filter:drop-shadow(0 4px 5px rgba(0,0,0,.35))}
.say{pointer-events:none}
#shower{cursor:grab}
.spray path{stroke-dasharray:5 7;animation:fall .3s linear infinite}
@keyframes fall{to{stroke-dashoffset:-12}}
#dryer{cursor:grab}
.air path{stroke-dasharray:6 6;animation:fall .35s linear infinite}
#bottle{cursor:grab}#bottle .squirt{opacity:0}#bottle.on .squirt{opacity:1;animation:fall .25s linear infinite}
.lights{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity .4s;--h:300;background:radial-gradient(ellipse 35% 60% at 25% 10%,hsl(var(--h) 95% 65% / .55),transparent 70%),radial-gradient(ellipse 35% 60% at 75% 10%,hsl(calc(var(--h) + 140) 95% 65% / .55),transparent 70%),radial-gradient(ellipse 60% 25% at 50% 95%,hsl(calc(var(--h) + 60) 95% 60% / .5),transparent 70%)}
.lights.on{opacity:1}
.tone{display:block;width:44px;height:44px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #F3C3D8}
#home{position:fixed;inset:0;z-index:20;overflow-y:auto;background:radial-gradient(circle,#fff9 0 3px,transparent 4px) 0 0/38px 38px,radial-gradient(ellipse at 50% 0%,#FFF6FA,#FFD0E4 60%,#F7B6D2);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:max(16px,env(safe-area-inset-top,0px)) 24px;box-sizing:border-box}
.home-in{max-width:980px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:10px}
.logo{margin:0;display:flex;flex-direction:column;align-items:center;font-family:var(--display);font-weight:900;line-height:.92;text-align:center}
.l1,.l3{font-size:clamp(28px,5vw,46px);color:var(--berry)}
.l3{letter-spacing:.22em;text-transform:uppercase;font-size:clamp(22px,4vw,36px)}
.l2{position:relative;display:inline-block;font-size:clamp(76px,14vw,140px);padding-top:.42em;background:linear-gradient(180deg,#FF9ACB,#E2559B 55%,#B21E66);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 5px 0 #fff) drop-shadow(0 8px 12px rgba(194,38,111,.3))}
.crown{position:absolute;left:50%;top:.04em;width:.78em;transform:translateX(-50%) rotate(-7deg);filter:drop-shadow(0 4px 4px rgba(150,90,0,.3))}
.home-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px;width:100%;align-items:center;margin-top:6px}
.portrait{width:min(100%,360px);aspect-ratio:1;margin:0 auto;border-radius:50%;overflow:hidden;border:8px solid #fff;box-shadow:0 10px 30px rgba(194,38,111,.25);background:radial-gradient(circle at 50% 40%,#fff,#FFE0EE 60%,#FFC2DB)}
#homeKiki{width:100%;height:100%;display:block}
.home-form{background:#fff;border-radius:28px;padding:22px;display:flex;flex-direction:column;gap:12px;box-shadow:0 6px 0 #F5C2D9;min-width:0}
.home-form label,.home-form h3{font-family:var(--display);font-weight:900;font-size:22px;color:var(--berry);margin:0}
#pname{font:inherit;font-weight:900;font-size:24px;padding:12px 18px;border-radius:18px;border:3px solid var(--blush);color:var(--ink);background:#FFF7FB;outline:none;min-width:0}
#pname:focus{border-color:var(--berry)}
#homeTones{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
#homeTones .opt{padding:8px 2px 6px}
.play{appearance:none;border:0;cursor:pointer;font-family:var(--display);font-weight:900;font-size:28px;color:#fff;background:linear-gradient(#E2559B,#C2266F);border-radius:24px;padding:16px;box-shadow:0 6px 0 #8E1650;margin-top:6px}
.play:active{transform:translateY(3px);box-shadow:0 3px 0 #8E1650}
@media (max-width:720px){.home-grid{grid-template-columns:1fr}.portrait{width:min(100%,260px)}}
#kiki.placing{cursor:copy}

#modal[hidden],[hidden]{display:none!important}
.homelinks{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:14px}
.homelinks button{appearance:none;border:0;cursor:pointer;font:inherit;font-weight:900;font-size:15px;color:var(--ink);background:#fff;border-radius:999px;padding:10px 16px;box-shadow:0 3px 0 #F5C2D9}
#modal{position:fixed;inset:0;z-index:40;background:rgba(74,12,44,.45);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.mbox{position:relative;background:#fff;border-radius:28px;max-width:520px;width:100%;max-height:85vh;overflow-y:auto;padding:24px 22px 22px;box-shadow:0 20px 50px rgba(74,12,44,.35);box-sizing:border-box;user-select:text;-webkit-user-select:text}
.mbox h2{font-family:var(--display);font-weight:900;font-size:28px;color:var(--berry);margin:0 40px 12px 0}
.mbox h3{font-size:16px;margin:16px 0 4px;color:var(--berry)}
.mbox p{margin:6px 0;line-height:1.5;font-weight:700;color:var(--ink)}
.mbox .small{font-size:13px;opacity:.8}
.mclose{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:50%;border:0;background:var(--tray);color:var(--ink);font-size:18px;font-weight:900;cursor:pointer}
.mail{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;background:var(--tray);border-radius:14px;padding:12px 14px;word-break:break-all;user-select:all;-webkit-user-select:all}
.mbox .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.mbox .primary,.mbox .ghost,.mbox .danger{appearance:none;border:0;cursor:pointer;font:inherit;font-weight:900;font-size:16px;border-radius:16px;padding:12px 16px;text-decoration:none;display:inline-block}
.mbox .primary{background:var(--berry);color:#fff}
.mbox .ghost{background:var(--tray);color:var(--ink)}
.mbox .danger{background:#D9223B;color:#fff}
.setrow{appearance:none;border:0;cursor:pointer;font:inherit;font-weight:900;font-size:18px;color:var(--ink);width:100%;display:flex;align-items:center;justify-content:space-between;background:var(--tray);border-radius:18px;padding:14px 16px;margin-top:10px}
.switch{width:56px;height:32px;border-radius:999px;background:#D8C9D1;position:relative;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:left .2s}
.setrow[aria-pressed="true"] .switch{background:var(--berry)}
.setrow[aria-pressed="true"] .switch::after{left:28px}
.setblock{margin-top:16px;padding-top:14px;border-top:2px dashed var(--blush)}
.gatein{font:inherit;font-weight:900;font-size:24px;padding:10px 14px;border-radius:14px;border:3px solid var(--blush);width:140px;color:var(--ink)}
</style>

</head>

<script>
(()=>{
const NAME='Kiki';
let SKIN='#E0AE88', SKIN_D='#C99470';const LINE='#2E180F';
const TONES={fair:{n:'Very fair',c:['#FDEADF','#F5D6C3','#E0B59B','#CD9C80']},kiki:{n:"Kiki's",c:['#EDC09C','#E0AE88','#C99470','#B98159']},dark:{n:'Darker',c:['#C48E64','#AE7850','#93603C','#7E4F2E']},vdark:{n:'Very dark',c:['#87593D','#6E4630','#57361F','#452816']}};
function applyTone(){const t=(TONES[S.skin]||TONES.kiki).c;SKIN=t[1];SKIN_D=t[2];
  const set=(id,cols)=>{const st=document.querySelectorAll('#'+id+' stop');cols.forEach((c,i)=>{if(st[i])st[i].setAttribute('stop-color',c);});};
  set('g-skin',[t[0],t[1],t[3]]);set('g-neck',[t[3],t[1],t[3]]);set('g-ear',[t[2],t[1]]);set('g-leg',[t[3],t[0],t[1],t[3]]);}
const $=s=>document.querySelector(s);
const f1=n=>Math.round(n*10)/10;
const P=(x,y)=>`${f1(x)},${f1(y)}`;
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const cap=s=>s[0].toUpperCase()+s.slice(1);
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function bez(p0,p1,p2,p3,t){const u=1-t;return[0,1].map(k=>u*u*u*p0[k]+3*u*u*t*p1[k]+3*u*t*t*p2[k]+t*t*t*p3[k]);}
function smooth(pts,closed=true){
  const n=pts.length;let d='M'+P(...pts[0]);const last=closed?n:n-1;
  for(let i=0;i<last;i++){
    const g=j=>closed?pts[(j+n)%n]:pts[Math.max(0,Math.min(n-1,j))];
    const p0=g(i-1),p1=g(i),p2=g(i+1),p3=g(i+2);
    d+=`C${P(p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6)} ${P(p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6)} ${P(p2[0],p2[1])}`;
  }
  return d+(closed?'Z':'');
}
const line=(a,b,c,w,x='')=>`<path d="M${P(...a)}L${P(...b)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" fill="none" ${x}/>`;
const spark=(x,y,r)=>`M${P(x,y-r)}L${P(x+r*.28,y-r*.28)}L${P(x+r,y)}L${P(x+r*.28,y+r*.28)}L${P(x,y+r)}L${P(x-r*.28,y+r*.28)}L${P(x-r,y)}L${P(x-r*.28,y-r*.28)}Z`;
const heart=(x,y,s,c,x2='')=>`<path d="M${P(x,y+s*.9)}C${P(x-s*1.6,y-s*.2)} ${P(x-s*.6,y-s*1.3)} ${P(x,y-s*.4)}C${P(x+s*.6,y-s*1.3)} ${P(x+s*1.6,y-s*.2)} ${P(x,y+s*.9)}Z" fill="${c}" ${x2}/>`;
const star=(x,y,r,c,x2='')=>{let d='';for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;d+=(i?'L':'M')+P(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}return `<path d="${d}Z" fill="${c}" ${x2}/>`;};
const flower=(x,y,r,pc,cc)=>{let s='';for(let i=0;i<5;i++){const a=i*Math.PI*2/5-Math.PI/2;s+=`<circle cx="${f1(x+Math.cos(a)*r*.75)}" cy="${f1(y+Math.sin(a)*r*.75)}" r="${f1(r*.55)}" fill="${pc}"/>`;}return s+`<circle cx="${x}" cy="${y}" r="${f1(r*.42)}" fill="${cc}"/>`;};
const bow=(x,y,s,c,k='#fff')=>`<g transform="translate(${x} ${y}) scale(${s})"><path d="M0,0C-20,-18 -34,-6 -31,7C-28,18 -12,13 0,0Z" fill="${c}" stroke="#0002" stroke-width="2"/><path d="M0,0C20,-18 34,-6 31,7C28,18 12,13 0,0Z" fill="${c}" stroke="#0002" stroke-width="2"/><path d="M-4,4L-12,24M4,4L12,24" stroke="${c}" stroke-width="6" stroke-linecap="round"/><circle r="7" fill="${c}" stroke="${k}" stroke-width="2"/></g>`;

/* ---------- HAIR ---------- */
const HAIR={brown:['#3B2317'],black:['#17110E'],blonde:['#E2B85C'],ginger:['#C4532B'],pink:['#FF7DB5'],purple:['#9466F4'],blue:['#3C9EFF'],
  rainbow:['url(#g-rainbow)','linear-gradient(#FF5D73,#FFB347,#FFE066,#6EE7A8,#5AB8FF,#B07CFF)'],
  mermaid:['url(#g-mermaid)','linear-gradient(#2FD6C6,#5A8CFF,#B25CFF)'],
  candy:['url(#g-candy)','linear-gradient(#FF6FAE,#FFB9D9,#FFE58A)']};
const STYLES=[['half','Half up'],['long','Long'],['pony','Ponytail'],['pigtails','Pigtails'],['braids','Braids'],['plaitpony','Side plaits'],['bun','Bun'],['space','Space buns'],['bob','Short bob']];
const GLITTER={gold:['#FFE27A','#FFC93C','#FFFFFF'],silver:['#FFFFFF','#DDE6F5','#BFD0EA'],pink:['#FF9ACB','#FF5FA2','#FFFFFF'],rainbow:['#FF5D73','#FFB347','#FFE066','#6EE7A8','#5AB8FF','#B07CFF']};
const CAPD='M124,178 C108,40 292,40 276,178 C268,140 246,119 200,121 C154,119 132,140 124,178Z';
const CAPO=[[124,178],[108,40],[292,40],[276,178]];
const BUB=[[172,90,16],[206,78,19],[240,94,15],[150,118,13],[256,122,14],[188,108,11],[222,104,12],[128,150,12],[273,150,13],[112,192,11],[289,194,12],[178,66,12],[232,66,13],[262,80,10],[140,96,11],[110,236,12],[290,240,13],[204,56,11]];

function tail(a,b,w0,w1,tex){
  if(tex==='curly'){b=[a[0]+(b[0]-a[0])*.86,a[1]+(b[1]-a[1])*.86];w0*=1.08;w1*=1.3;}
  const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,nx=-uy,ny=ux;
  const at=(t,f)=>{
    let hw=(w0+(w1-w0)*t)/2,wave=0;
    if(tex==='wavy')wave=9*Math.sin(t*Math.PI*5)*Math.min(1,t*2.5);
    if(tex==='curly')hw+=Math.abs(f)*(5+9*Math.abs(Math.sin(t*Math.PI*9)))*Math.min(1,t*4);
    const cx=a[0]+dx*t+nx*wave,cy=a[1]+dy*t+ny*wave;
    return[cx+nx*hw*f,cy+ny*hw*f];
  };
  const N=30,pts=[];
  for(let i=0;i<=N;i++)pts.push(at(i/N,1));
  const E=at(1,0),e1=at(1,1),hwE=Math.hypot(e1[0]-E[0],e1[1]-E[1]);
  const depth=tex==='straight'?.3:tex==='wavy'?.45:.6,K=12;
  for(let k=1;k<K;k++){const th=Math.PI*k/K,r=hwE*(tex==='curly'?1+.13*Math.abs(Math.sin(k*1.7)):1);
    pts.push([E[0]+nx*r*Math.cos(th)+ux*r*Math.sin(th)*depth,E[1]+ny*r*Math.cos(th)+uy*r*Math.sin(th)*depth]);}
  for(let i=N;i>=0;i--)pts.push(at(i/N,-1));
  pts.push([a[0]-ux*34,a[1]-uy*34]);
  let strands='';
  if(tex==='curly'){
    for(let i=0;i<26;i++){const t=Math.min(.94,.08+(i%13)*.068),f=(i<13?-.5:.5)+((i*37)%10-5)/18,p=at(t,f),r=5+(i%3)*1.5;
      strands+=`<circle cx="${f1(p[0])}" cy="${f1(p[1])}" r="${r}" fill="none" stroke="rgba(0,0,0,.26)" stroke-width="2"/><path d="M${P(p[0]-r*.7,p[1]-r*.7)}A${r},${r} 0 0 1 ${P(p[0]+r*.7,p[1]-r*.7)}" stroke="rgba(255,255,255,.2)" stroke-width="1.4" fill="none"/>`;}
  }else{
    for(let k=0;k<24;k++){const f=-.94+k*(1.88/23),sp=[],t1=.84+((k*13)%7)*.018;for(let t=.02;t<=t1;t+=.06)sp.push(at(t,f));
      const lt=k%3===1;strands+=`<path d="${smooth(sp,false)}" fill="none" stroke="${lt?'rgba(255,255,255,.15)':'rgba(0,0,0,.26)'}" stroke-width="${lt?1:1.4}" stroke-linecap="round"/>`;}
  }

function legShape(sd){const X=x=>sd>0?x:400-x;
  return `M${X(165)},418C${X(163)},470 ${X(166)},515 ${X(168)},540C${X(164)},566 ${X(164)},598 ${X(168)},648L${X(184)},648C${X(188)},600 ${X(193)},566 ${X(191)},540C${X(194)},505 ${X(196)},465 ${X(195)},418Z`;}
function legSkin(){return [1,-1].map(sd=>{const d=legShape(sd),X=x=>sd>0?x:400-x;
  return `<path d="${d}" fill="url(#g-leg)"/>`+(LITE?'':`<path d="M${X(171)},528Q${X(179)},536 ${X(188)},528" stroke="#9E6646" stroke-width="1.6" opacity=".35" fill="none"/><path d="M${X(173)},546Q${X(179)},551 ${X(186)},546" stroke="#9E6646" stroke-width="1.2" opacity=".2" fill="none"/><path d="M${X(175)},560L${X(174)},630" stroke="#fff" stroke-width="4" opacity=".14" filter="url(#f-soft2)"/><path d="M${X(172)},476L${X(174)},516" stroke="#fff" stroke-width="5" opacity=".1" filter="url(#f-soft2)"/><circle cx="${X(170)}" cy="637" r="2.2" fill="#A86A48" opacity=".25"/><path d="${d}" fill="none" stroke="#A86A48" stroke-opacity=".4" stroke-width="1"/>`);}).join('');}
const legs=(c)=>[1,-1].map(sd=>`<path d="${legShape(sd)}" fill="${c}"/><path d="${legShape(sd)}" fill="none" stroke="#000" stroke-opacity=".12" stroke-width="1"/>`).join('');

function spinState(th,last){const back=Math.cos(th)<0;if(back!==last.back){S._back=back;$('#char').innerHTML=charSVG(S);last.back=back;}return .58+.42*Math.abs(Math.cos(th));}
function orbit(n=10,dur=1600){for(let i=0;i<n;i++){const fr=[];for(let j=0;j<=12;j++){const a=i/n*6.283+j/12*6.283*2,x=200+Math.cos(a)*150,y=430+Math.sin(a)*34,front=Math.sin(a)>0;fr.push({...TR(x,y,front?1.2:.6,j*30,front?1:.35)});}

/* hip-hop beat */
let NB=null;function noiseBuf(){if(!NB){NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}return NB;}
function beatTrack(bars,B){if(!SET.music)return null;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){return null;}
  const M=AC.createGain();M.gain.value=.9;M.connect(AC.destination);const T0=AC.currentTime+.08,st=B/4;
  const kick=t=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.14);g.gain.setValueAtTime(.55,t);g.gain.exponentialRampToValueAtTime(.001,t+.32);o.connect(g).connect(M);o.start(t);o.stop(t+.34);};
  const nz=(t,d,f,v,type='highpass')=>{const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noiseBuf();fl.type=type;fl.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(fl).connect(g).connect(M);s.start(t,Math.random()*.5);s.stop(t+d+.02);};
  const snare=t=>{nz(t,.2,1400,.32);const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=190;g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.1);o.connect(g).connect(M);o.start(t);o.stop(t+.12);};
  const bass=(t,f,d)=>{const o=AC.createOscillator(),fl=AC.createBiquadFilter(),g=AC.createGain();o.type='sawtooth';o.frequency.value=f;fl.type='lowpass';fl.frequency.value=380;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.22,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(fl).connect(g).connect(M);o.start(t);o.stop(t+d+.02);};
  const stab=(t,fs)=>fs.forEach(f=>{const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+.35);o.connect(g).connect(M);o.start(t);o.stop(t+.37);});
  const PROG=[[55,[220,261.6,329.6]],[43.65,[174.6,220,261.6]],[65.4,[261.6,329.6,392]],[49,[196,246.9,293.7]]];
  for(let b=0;b<bars;b++){const [root,ch]=PROG[b%4];
    for(let i=0;i<16;i++){const t=T0+(b*16+i)*st+(i%2?st*.16:0);
      if([0,7,10].includes(i))kick(t);if(i===4||i===12)snare(t);if(i%2===0)nz(t,.04,7500,.07);if(i===14)nz(t,.18,6000,.06);
      if(i===0)bass(t,root,st*5);if(i===7)bass(t,root,st*2);if(i===10)bass(t,root*1.5,st*3);if(i===3||i===11)stab(t,ch);}}
  return M;}
function startDance(){if(DANCE)return stopDance();if(MOVING)return;MOVING=true;const B=.632,BARS=8;$('#stk').style.opacity=0;$('#bub').style.opacity=0;
  const M=beatTrack(BARS,B),t0=performance.now()+80,last={back:false},lt=$('#lights');lt.classList.add('on');
  const words=["Let's dance!",'Side step!','Body wave!','Spin it!','Again!','Slide!','Wave it!','Freeze!'];let lastBar=-1,lastBeat=-1;
  DANCE={M};
  const step=now=>{if(!DANCE)return;const t=Math.max(0,(now-t0)/1000),b=t/B,bar=Math.floor(b/4),ph=b%1,bi=b%4,dir=bar>=4?-1:1;
    if(bar>=BARS)return stopDance(true);
    if(bar!==lastBar){lastBar=bar;say(words[bar%8]);}
    const beat=Math.floor(b);if(beat!==lastBeat){lastBeat=beat;lt.style.setProperty('--h',(beat*67)%360);if(beat%2===0)burst(200,640,4,90,['#FF5FA2','#5AB8FF','#FFE27A','#6EE7A8']);}
    const dip=Math.pow(Math.cos(Math.PI*ph),2);let o={};
    switch(bar%4){
      case 0:o={y:9*dip,sy:1-.03*dip,head:7*Math.sin(2*Math.PI*ph)};break;
      case 1:o={x:dir*32*Math.sin(Math.PI*b/2),rot:dir*6*Math.sin(Math.PI*b/2),y:6*dip,head:-5*Math.sin(Math.PI*b/2)};break;
      case 2:{const w=Math.sin(Math.PI*b);o={skx:11*w,x:8*w,y:5*dip,sy:1-.03*Math.abs(w),head:-6*w};break;}
      case 3:if(bi<2){const th=(bi/2)*Math.PI*2*dir;o={sx:spinState(th,last),y:-6*Math.sin(Math.PI*bi/2),skx:Math.sin(th)*4};if(bi<.05)orbit(8,1300);}
             else if(bi<3){if(last.back){S._back=false;$('#char').innerHTML=charSVG(S);last.back=false;}o={y:-46*Math.sin(Math.PI*(bi-2)),sy:1.03};}
             else o={rot:-9*dir,sx:1.05,sy:1.05,head:12*dir,x:-10*dir};break;}
    setPose(o);DANCE.raf=requestAnimationFrame(step);};
  DANCE.raf=requestAnimationFrame(step);}
function stopDance(done){if(!DANCE)return;cancelAnimationFrame(DANCE.raf);const M=DANCE.M;DANCE=null;
  if(M&&AC){try{M.gain.setValueAtTime(M.gain.value,AC.currentTime);M.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.3);setTimeout(()=>M.disconnect(),400);}catch(e){}}
  S._back=false;$('#char').removeAttribute('transform');renderChar();$('#lights').classList.remove('on');$('#stk').style.opacity='';$('#bub').style.opacity='';MOVING=false;
  if(done){sfx.tada();confetti(80);say('Yeah! Nailed it!');}}

function buildRig(){RIG={};charSVG(S);const R=RIG;RIG=null;const cut=CUTS[S.outfit]||430;RIGCUT=cut;
  const arm=sd=>{const a=sd>0?L_SH:R_SH,b=sd>0?L_HD:R_HD,p=t=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t],sl=R.sleeve;

  $('#char').innerHTML=`<defs><g id="rigbody">${R.body}</g><clipPath id="rig-up"><rect x="0" y="0" width="400" height="${cut}"/></clipPath><clipPath id="rig-ll"><rect x="0" y="${cut}" width="200" height="400"/></clipPath><clipPath id="rig-rl"><rect x="200" y="${cut}" width="200" height="400"/></clipPath></defs>`
    +R.shadow+R.hairBack+`<g class="legL"><use href="#rigbody" clip-path="url(#rig-ll)"/></g><g class="legR"><use href="#rigbody" clip-path="url(#rig-rl)"/></g><use href="#rigbody" clip-path="url(#rig-up)"/>`
    +arm(1)+arm(-1)+`<g class="headg">${R.head}</g>`+R.top;}
function setRig(o){const q=(sel,tr)=>{const e=$('#char '+sel);if(e)e.setAttribute('transform',tr);};
  const aL=o.aL||[0,0],aR=o.aR||[0,0],lL=o.lL||[0,0,1],lR=o.lR||[0,0,1];
  q('.armL',`rotate(${f1(aL[0])} 152 306)`);q('.armL .fore',`rotate(${f1(aL[1])} 142 388)`);
  q('.armR',`rotate(${f1(-aR[0])} 248 306)`);q('.armR .fore',`rotate(${f1(-aR[1])} 258 388)`);
  q('.legL',`translate(0 ${f1(-lL[1])}) translate(182 ${RIGCUT}) rotate(${f1(lL[0])}) scale(1 ${(lL[2]||1).toFixed(3)}) translate(-182 ${-RIGCUT})`);
  q('.legR',`translate(0 ${f1(-lR[1])}) translate(218 ${RIGCUT}) rotate(${f1(-lR[0])}) scale(1 ${(lR[2]||1).toFixed(3)}) translate(-218 ${-RIGCUT})`);}
function spinRig(th,last){const back=Math.cos(th)<0;if(back!==last.back){S._back=back;buildRig();last.back=back;}return .58+.42*Math.abs(Math.cos(th));}
function twirl3d(){if(MOVING)return;MOVING=true;$('#stk').style.opacity=0;$('#bub').style.opacity=0;sfx.swish();setTimeout(()=>sfx.swish(),700);orbit();buildRig();
  const t0=performance.now(),D=1700,last={back:false};
  const step=now=>{const k=Math.min(1,(now-t0)/D),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2,th=e*Math.PI*4,sx=spinRig(th,last),up=Math.sin(k*Math.PI);
    setPose({sx,y:-up*16,skx:Math.sin(th)*4,head:Math.sin(th)*3});setRig({aL:[75*up,-20*up],aR:[75*up,-20*up],lL:[-6*up,4*up,1],lR:[14*up,10*up,.95]});
    if(k<1)requestAnimationFrame(step);else{S._back=false;$('#char').removeAttribute('transform');renderChar();$('#stk').style.opacity='';$('#bub').style.opacity='';MOVING=false;burst(200,420,12,160);say('Wheee!');}};

function startDance(){if(DANCE)return stopDance();if(MOVING)return;MOVING=true;const B=.632,BARS=8;$('#stk').style.opacity=0;$('#bub').style.opacity=0;
  const M=beatTrack(BARS,B),t0=performance.now()+80,last={back:false},lt=$('#lights');lt.classList.add('on');buildRig();
  const words=["Let's dance!",'Side step!','Raise the roof!','Spin it!','Again!','Slide!','Hands up!','Freeze!'];let lastBar=-1,lastBeat=-1;
  DANCE={M};
  const step=now=>{if(!DANCE)return;const t=Math.max(0,(now-t0)/1000),b=t/B,bar=Math.floor(b/4),ph=b%1,bi=b%4,d=bar>=4?-1:1;
    if(bar>=BARS)return stopDance(true);
    if(bar!==lastBar){lastBar=bar;say(words[bar%8]);}
    const beat=Math.floor(b);if(beat!==lastBeat){lastBeat=beat;lt.style.setProperty('--h',(beat*67)%360);if(beat%2===0)burst(200,640,4,90,['#FF5FA2','#5AB8FF','#FFE27A','#6EE7A8']);}
    const dip=Math.pow(Math.cos(Math.PI*ph),2),sw=Math.sin(Math.PI*b),hb=Math.sin(Math.PI*b/2);let o={},r={};
    const L=(x,y)=>d>0?x:y,mir=(a,c)=>d>0?[a,c]:[c,a];
    switch(bar%4){
      case 0:o={y:9*dip,sy:1-.03*dip,head:7*Math.sin(2*Math.PI*ph)};
        r={aL:[18+10*sw,-75-35*Math.max(0,sw)],aR:[18-10*sw,-75-35*Math.max(0,-sw)],lL:[0,0,1-.07*dip],lR:[0,0,1-.07*dip]};break;
      case 1:{o={x:d*32*hb,rot:d*6*hb,y:6*dip,head:-5*hb};const kick=Math.max(0,Math.sin(Math.PI*b));const[a1,a2]=mir([40*hb+10,-30],[-40*hb+10,-30]);
        r={aL:a1,aR:a2,lL:[d>0?14*kick*(hb>0?1:-.3):6*kick,10*kick*(hb>0?1:0),1],lR:[d<0?14*kick*(hb<0?1:-.3):6*kick,10*kick*(hb<0?1:0),1]};break;}
      case 2:{const w=sw;o={skx:9*w,x:6*w,y:7*dip,head:-6*w};const pump=dip;
        r={aL:[150+12*pump,-55-20*pump],aR:[150+12*pump,-55-20*pump],lL:[4,0,beat%2?1:.9],lR:[4,0,beat%2?.9:1]};break;}
      case 3:if(bi<2){const th=(bi/2)*Math.PI*2*d;o={sx:spinRig(th,last),y:-6*Math.sin(Math.PI*bi/2),skx:Math.sin(th)*4};if(bi<.05)orbit(8,1300);r={aL:[85,-15],aR:[85,-15],lL:[-4,0,1],lR:[-4,0,1]};}
        else if(bi<3){if(last.back){S._back=false;buildRig();last.back=false;}const j=Math.sin(Math.PI*(bi-2));o={y:-46*j,sy:1.03};r={aL:[165*j,-20*j],aR:[165*j,-20*j],lL:[16*j,8*j,1-.1*j],lR:[16*j,8*j,1-.1*j]};}

    const beat=Math.floor(b);if(beat!==lastBeat){lastBeat=beat;lt.style.setProperty('--h',(beat*67)%360);if(mv!=='spin'||bt>=2)burst(200,650,5,100,['#FF5FA2','#5AB8FF','#FFE27A','#6EE7A8']);}

function tone(f,d=.12,type='sine',vol=.07,when=0){if(!SET.sfx)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*1.12,t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02);}catch(e){}}
function noise(d=.3,vol=.05,when=0){if(!SET.sfx)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const b=AC.createBuffer(1,AC.sampleRate*d,AC.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=(Math.random()*2-1)*(1-i/x.length);const s=AC.createBufferSource(),g=AC.createGain();s.buffer=b;g.gain.value=vol;s.connect(g).connect(AC.destination);s.start(AC.currentTime+when);}catch(e){}}
